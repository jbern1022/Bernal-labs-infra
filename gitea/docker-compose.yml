# Generated from the running containers (docker inspect) on docker-host,
# 2026-10-01, so deploying it reproduces what was running. Secrets come
# from .env next to this file (see .env.example); never commit .env.
services:
  gitea:
    image: gitea/gitea:latest@sha256:7d13848af12645600a5f9d93ee2560daa9c6fa6b5b859b7bff3a5e1c0b661031
    container_name: gitea
    restart: unless-stopped
    ports:
      - "222:22"
      - "3000:3000"
    volumes:
      - "/home/joe/gitea/data:/data"
    environment:
      GITEA__database__DB_TYPE: "sqlite3"
      USER_UID: "1000"
      USER_GID: "1000"
    dns:
      - "192.168.4.2"
