services:
  vaultwarden:
    image: vaultwarden/server:1.37.2
    container_name: vaultwarden
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
    ports:
      - '8080:80'
    volumes:
      - ./data:/data
    environment:
      - WEBSOCKET_ENABLED=true
