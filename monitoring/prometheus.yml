global:
  scrape_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'authelia'
    static_configs:
      - targets: ['authelia:9959']

  # futbol-api runs on k3s (VLAN50), reachable via the
  # futbol-api-metrics-svc NodePort on the control-plane node -- see
  # futbol-modelo/k8s/webapp.yaml. Requires that NodePort to actually be
  # applied to the cluster before this target will resolve.
  - job_name: 'futbol-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['192.168.4.63:30800']
