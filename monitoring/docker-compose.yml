# Generated from the running containers (docker inspect) on docker-host,
# 2026-10-01, so deploying it reproduces what was running. Secrets come
# from .env next to this file (see .env.example); never commit .env.
services:
  grafana:
    image: grafana/grafana:latest@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3030:3000"
    volumes:
      - "/home/joe/monitoring/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro"
      - "/home/joe/monitoring/dashboards:/var/lib/grafana/dashboards:ro"
      - "/home/joe/monitoring/data/grafana:/var/lib/grafana"
      - "/home/joe/monitoring/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro"
    environment:
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_CSRF_TRUSTED_ORIGINS: "grafana.josephbernal.com"
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_DOMAIN: "grafana.josephbernal.com"
      GF_SERVER_ROOT_URL: "https://grafana.josephbernal.com"
  node-exporter:
    image: prom/node-exporter:latest@sha256:e9cff4fc67b1818f8c97adb115b9f12c9a54b533de86765d4a0effc01b357205
    container_name: node-exporter
    restart: unless-stopped
    command: ["--path.procfs=/host/proc", "--path.sysfs=/host/sys"]
    ports:
      - "9100:9100"
    volumes:
      - "/proc:/host/proc:ro"
      - "/sys:/host/sys:ro"
      - "/:/rootfs:ro"
  prometheus:
    image: prom/prometheus:latest@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - "/home/joe/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml"
      - "/home/joe/monitoring/data/prometheus:/prometheus"
      - "/home/joe/monitoring/rules:/etc/prometheus/rules:ro"
