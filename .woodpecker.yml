steps:
  - name: validate-compose
    image: docker:27-cli
    commands:
      - apk add --no-cache docker-cli-compose
      - |
        set -e
        for f in $(find . -iname "docker-compose*.yml" -not -path "./.git/*"); do
          echo "--- $f ---"
          docker compose -f "$f" config --quiet
        done

  - name: secrets-scan
    image: zricethezav/gitleaks:v8.21.2
    commands:
      - gitleaks detect --source . -v --exit-code 1

# Bernal Labs CI/CD
# Both steps fail the pipeline (non-zero exit) on a problem: a broken compose
# file, or a real secret caught before it can be merged. Neither step needs
# docker socket access -- `docker compose config` only parses/renders the
# YAML, it doesn't talk to a daemon.
