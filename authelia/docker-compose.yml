# Generated from the running containers (docker inspect) on docker-host,
# 2026-10-01, so deploying it reproduces what was running. Secrets come
# from .env next to this file (see .env.example); never commit .env.
services:
  authelia:
    image: authelia/authelia:latest@sha256:1b363e9279e742397966333f364e0876ae02bf5c876de73e83af6d48c57ff51b
    container_name: authelia
    restart: unless-stopped
    ports:
      - "9091:9091"
    volumes:
      - "/home/joe/authelia/config:/config"
    environment:
      TZ: "America/New_York"
    networks:
      - default
      - nginx-proxy-manager_default
networks:
  nginx-proxy-manager_default:
    external: true
