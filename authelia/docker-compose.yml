services:
  authelia:
    image: authelia/authelia:v4.39.23
    container_name: authelia
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "authelia", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - '9091:9091'
      - '9959:9959'
    volumes:
      - /home/joe/authelia/config:/config
      - /home/joe/authelia/secrets:/secrets:ro
    environment:
      - TZ=America/New_York
      - AUTHELIA_SESSION_SECRET_FILE=/secrets/session_secret
      - AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE=/secrets/storage_encryption_key
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE=/secrets/jwt_secret
    networks:
      - default
      - monitoring_default

networks:
  monitoring_default:
    external: true
